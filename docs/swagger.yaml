openapi: 3.0.2
info:
  title: Games-API
  version: 1.0.0
  description: |
    ### This is a Swagger UI for our Games API

    ### Error handling
    Errors are presented using the HTTP status codes 400-599. The response include a more detailed explanation about the error in the body.
    {
      "error": "Cleartext explanation of the error that occurred"
    }
    
    ### Generic API errors
    These error responses can be returned by any of the described endpoints.

    | HTTP status | Description |
    |---|---|
    | 400 | Bad input parameters or invalid request. More information can be found in the response body. |
    | 401 | The consumer does not have access to the requested resource or the provided token is not valid. |
    | 404 | The requested resource can not be found or the user does not have access to the resource. |
    | 5XX | A server error has occurred while processing the request. |
paths:
  /games:
    get:
      tags:
        - games
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
              examples:
                List of games:
                  value:
                    - Witcher 3
                    - Cyberpunk 2077
          description: Returns a list of games
      summary: Get a list of all games
      description: Returns a list of all games in API
    post:
      requestBody:
        description: A new game to be created
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/new-game'
        required: true
      tags:
        - new-game
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/new-game'
          description: Game was created
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                Missing params:
                  value: "  {\r\n    \"error\": \"One or all params are missing\"\r\n  }"
          description: One or all params are missing
      summary: Creates a game
      description: Creates a new game
  '/games/{id}':
    get:
      tags:
        - details
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
              examples:
                Full details of a given game:
                  value: "\r\n{ id: 1, name: \"Witcher 3\", price: 29.99 },\r\n{ id: 2, name: \"Cyberpunk 2077\", price: 59.99 },\r\n{ id: 3, name: \"Minecraft\", price: 26.99 },\r\n{ id: 4, name: \"Counter-Strike: Global Offensive\", price: 0 },\r\n{ id: 5, name: \"Roblox\", price: 0 },\r\n{ id: 6, name: \"Grand Theft Auto V\", price: 29.99 },\r\n{ id: 7, name: \"Valorant\", price: 0 },\r\n{ id: 8, name: \"Forza Horizon 5\", price: 59.99 }"
          description: Returns full details of a given id games
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                Game \w+ was not found:
                  value: Game \\w+ was not found in game array
            error: {}
          description: Game was not found in games array
      operationId: id
      summary: Get full details of a game
      description: Returns full details of a given id game
    put:
      requestBody:
        description: New data of the game
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/new-game'
            examples:
              Updated game:
                value: |4-
                      {
                        "name": "Witcher 3 GOTY",
                        "price": 19.99
                      }
        required: true
      tags:
        - update-game
      parameters:
        -
          name: id
          in: path
          required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/new-game'
              examples:
                Update:
                  value:
                    id: 1
                    name: Witcher 3 GOTY
                    price: 19.99
          description: Game was updated
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                error:
                  value:
                    error: One or all params are missing
          description: One or all params are missing
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                error:
                  value:
                    error: Game not found
          description: Game was not found in games array
      summary: Updates a game
      description: Updates the name and price of a game with the given id
    delete:
      requestBody:
        description: Id of the game to be deleted
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/delete-game'
        required: false
      tags:
        - delete-game
      responses:
        '204':
          description: Game was deleted successfully
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                Game not found:
                  value: "  {\r\n    \"error\": \"Game not found\"\r\n  }"
          description: Game was not found in games array
      summary: Delete a game
      description: "\tDeletes a game with the given id"
components:
  schemas:
    error:
      title: Root Type for error
      description: ''
      type: object
      properties:
        error:
          type: string
      example:
        error: Error message.
    new-game:
      title: Root Type for new-game
      description: ''
      required:
        - price
        - name
      type: object
      properties:
        name:
          type: string
        price:
          format: float
          type: number
      example:
        name: Tetris
        price: 0.99
    delete-game:
      title: Root Type for delete-game
      description: ''
      required:
        - id
      type: object
      properties:
        id:
          type: string
      example:
        id: 1